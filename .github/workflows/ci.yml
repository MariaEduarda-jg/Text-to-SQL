name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests app
      - name: Testes unitários
        run: pytest -q
      - name: Smoke test do pipeline (dados reais + baseline aleatório)
        run: |
          vbr data
          vbr eval -b enem_2024 -m mock:random --limit 50 --tag ci
          vbr report
          python - <<'EOF'
          import json
          rows = json.load(open("results/leaderboard.json"))
          ci = [r for r in rows if r["model"].endswith("[ci]")][0]
          assert ci["n"] == 50, ci
          assert 0 <= ci["acc"] <= 60, f"baseline aleatório suspeito: {ci}"
          print("pipeline ok:", ci)
          EOF
